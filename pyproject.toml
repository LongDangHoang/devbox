[project]
name = "devbox"
version = "0.1.0"
description = "Manage per-project Claude Code dev boxes"
requires-python = ">=3.11"

[project.scripts]
devbox = "devbox.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["copier", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
